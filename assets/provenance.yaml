- path: public/flags-v1.png
  origin: licensed
  tool: "tools/flag-sprite.mjs (sharp): the 4x3 SVG flags of the 193 UN member states, each drawn at 44 by 33 pixels with 12 colours at most and no dithering, laid on one sheet 16 to a row in the order of src/shared/games/flags-around-the-world/flags.json. The package is fetched for the run (npm pack flag-icons) and is not a dependency"
  model: "claude-fable-5-2 (wrote the script)"
