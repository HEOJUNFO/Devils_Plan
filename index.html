<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- A phone's keyboard is laid over the page and does not shrink it: the frame keeps its size while a box is typed in. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-visual" />
    <!--
      The title, the description and what a search engine and a shared link read (which address to index,
      the pages in each language, the card a messenger draws) are put in here by the build, from the words
      in src/shared/site/words.ts (vite.config.ts).
    -->
    <meta name="theme-color" content="#0d1020" />
    <!-- A pixel mark of the page's own, drawn here so no request is made for one. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%230d1020'/%3E%3Crect x='2' y='2' width='12' height='12' fill='%23ffb43c'/%3E%3Crect x='4' y='4' width='8' height='8' fill='%230d1020'/%3E%3Crect x='7' y='7' width='2' height='2' fill='%23ffb43c'/%3E%3C/svg%3E"
    />
    <!-- No word can be shown before the pixel font is in: it is asked for at once, not when the stylesheet has been read. -->
    <link rel="preload" href="/assets/fonts/Galmuri11-common.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/client/style.css" />
  </head>
  <body>
    <!--
      Everything is laid out on the game's own 480 by 270 pixels and scaled up as one piece.
      No sentence is written here: the page is read in Korean or in English, and main.ts
      puts the words of the reader's language in (src/client/words.ts). A reader without the
      script is shown the title and the description the build puts in the head, and a link to
      the pages that are read without it (/ko/, /en/).
    -->
    <div id="frame">
      <!-- The lobby: the rooms anyone can join, of every game. -->
      <section id="rooms" aria-labelledby="rooms-title">
        <canvas id="lobby-art" aria-hidden="true"></canvas>
        <header>
          <h2 id="rooms-title"></h2>
          <!-- Whose rooms are listed, every game's or one's: opens the games to pick from, which are laid where the list is. -->
          <button id="rooms-pick" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="rooms-games"></button>
          <p id="rooms-count"></p>
        </header>
        <div id="rooms-games" role="group" hidden></div>
        <!-- When people are asked to gather, and for which game (`src/shared/meet.ts`): a press lists that game's rooms. -->
        <button id="meet" type="button" class="room-row" hidden><span class="room-host"></span><span class="room-count"></span><span class="room-game"></span></button>
        <p id="rooms-note" role="status"></p>
        <ol id="room-list"></ol>
      </section>

      <main id="entry" class="panel">
        <h1 id="entry-title"></h1>
        <p class="sub" id="entry-sub"></p>

        <label for="nick" id="nick-label"></label>
        <input id="nick" type="text" autocomplete="off" />
        <!-- Straight into a room that is waiting for players, or a room of one's own. -->
        <div class="row ways">
          <button id="quick" type="button"></button>
          <button id="create" type="button" class="primary"></button>
        </div>

        <p class="or" id="by-code"></p>
        <div class="row">
          <input id="code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" />
          <button id="join" type="button"></button>
        </div>

        <p id="notice" role="alert"></p>
      </main>

      <!-- Making a room: which game, and whether anyone may join. -->
      <section id="new-room" class="panel" aria-labelledby="new-room-title" hidden>
        <h2 id="new-room-title"></h2>
        <p class="label" id="game-label"></p>
        <!-- What the chosen game is about is said in the bar under the frame, which has the room for it. -->
        <div id="game-choices" class="choices" role="group" aria-labelledby="game-label"></div>
        <p class="label" id="listed-label"></p>
        <div class="row" role="group" aria-labelledby="listed-label">
          <button id="listed-yes" type="button" class="choice"></button>
          <button id="listed-no" type="button" class="choice"></button>
        </div>
        <p id="listed-hint"></p>
        <div class="row bottom">
          <button id="create-cancel" type="button"></button>
          <button id="create-go" type="button" class="primary"></button>
        </div>
      </section>

      <!-- In a room, before a game: the scene shows who is here. -->
      <canvas id="scene" aria-hidden="true" hidden></canvas>
      <!-- How long the room takes to answer this page: over a corner of the room's picture. -->
      <p id="ping" hidden></p>
      <!-- How loud the sound is, and the button that changes it: over the other corner of the room's picture. -->
      <button id="sound" type="button" hidden></button>
      <section id="room" class="panel" hidden>
        <p class="label" id="room-game"></p>
        <div class="code-row">
          <p class="room-code"><strong id="room-code"></strong></p>
          <button id="copy" type="button"></button>
        </div>
        <p id="status" role="status" class="sr-only"></p>
        <ol id="players" class="sr-only"></ol>
        <!-- The voice controls (#voice) and the chat (#chat), below, are laid over the gap left here. -->
        <div class="row bottom second">
          <button id="start" type="button" class="primary"></button>
          <button id="ready" type="button" class="primary" hidden></button>
          <button id="clock" type="button"></button>
          <button id="variant" type="button" hidden></button>
          <!-- Where a game has both a clock and a choice of ways the two do not fit beside the start: this opens them (`#options-sheet`). -->
          <button id="options-open" type="button" aria-haspopup="dialog" hidden></button>
          <button id="team" type="button" hidden></button>
        </div>
        <div class="row bottom">
          <button id="leave" type="button"></button>
          <button id="listing" type="button" hidden></button>
          <button id="swap" type="button" hidden></button>
        </div>
      </section>

      <footer id="bar">
        <p id="bar-1"></p>
        <p id="bar-2" class="dim"></p>
        <button id="rules-open" type="button" hidden></button>
        <!-- The other language the page can be read in, named in that language; offered in the lobby. -->
        <button id="lang" type="button" hidden></button>
        <!-- In the lobby: the player's own record, once there is a game in it; the button for a word about the game, where one can be sent on; and which build the page is. -->
        <p id="about" class="dim" hidden><button id="record-open" type="button" hidden></button><button id="feedback" type="button" hidden></button><span id="version"></span></p>
      </footer>

      <canvas id="table" hidden></canvas>
      <button id="leave-game" type="button" hidden></button>
      <!-- Under a finger the way out and the voice controls are too small to sit over a game: one button opens them (#game-menu, below). -->
      <button id="menu-open" type="button" aria-haspopup="dialog" hidden></button>

      <!-- The room's voice chat: under the room's code in the waiting room, beside the way out during a game. -->
      <div id="voice" role="group" hidden>
        <button id="voice-mic" type="button" hidden></button>
        <button id="voice-toggle" type="button"></button>
        <p id="voice-note" hidden></p>
      </div>

      <!-- During a game the right-hand column shows the moves or the chat. -->
      <div id="tabs" role="group" hidden>
        <button id="tab-log" type="button" class="choice" aria-pressed="true"></button>
        <button id="tab-chat" type="button" class="choice" aria-pressed="false"></button>
        <!-- Once a game is over, for whoever played it: its result, to pass on. -->
        <button id="tab-share" type="button" hidden></button>
      </div>

      <!-- The room's chat: in the waiting room's column, and during a game in place of the moves. -->
      <section id="chat" hidden>
        <ol id="chat-log" aria-live="polite"></ol>
        <form id="chat-form">
          <!-- Who the next line is said to: everyone in the room, or one player alone (`#to-sheet`). -->
          <button id="chat-to" type="button" aria-haspopup="dialog"></button>
          <input id="chat-input" type="text" autocomplete="off" />
          <button id="chat-send" type="submit"></button>
        </form>
      </section>

      <!--
        Under a finger, during a game: what a keyboard does with a key and a mouse with a small button,
        on buttons a finger can press. main.ts moves the way out and the voice controls in here.
      -->
      <section id="game-menu" role="dialog" aria-modal="true" hidden>
        <div id="menu-list">
          <button id="menu-rules" type="button"></button>
          <button id="menu-sound" type="button"></button>
          <button id="menu-full" type="button" hidden></button>
          <button id="menu-close" type="button" class="primary"></button>
          <p id="menu-ping" hidden></p>
        </div>
      </section>

      <!-- What can be said with one press, opened by the chat's button while its box is empty. -->
      <section id="quick-sheet" role="dialog" aria-labelledby="quick-title" hidden>
        <h2 id="quick-title"></h2>
        <p id="quick-help" class="dim"></p>
        <div id="quick-words"></div>
        <div class="row">
          <button id="quick-close" type="button"></button>
        </div>
      </section>

      <!-- What the host can do with another player: opened by a press on their figure in the scene. -->
      <!-- Who the chat's next line is said to: everyone, or one of the others in the room alone. -->
      <section id="to-sheet" role="dialog" aria-labelledby="to-title" hidden>
        <h2 id="to-title"></h2>
        <p id="to-help" class="dim"></p>
        <div id="to-people"></div>
        <div class="row">
          <button id="to-close" type="button"></button>
        </div>
      </section>

      <!-- What the game is played by in this room, where that is more than the row beside the start holds: the buttons themselves are put in here. -->
      <section id="options-sheet" role="dialog" aria-labelledby="options-title" hidden>
        <h2 id="options-title"></h2>
        <p id="options-help" class="dim"></p>
        <div id="options-list"></div>
        <div class="row">
          <button id="options-close" type="button"></button>
        </div>
      </section>

      <section id="seat-menu" role="dialog" aria-labelledby="seat-name" hidden>
        <p id="seat-name"></p>
        <button id="seat-host" type="button"></button>
        <button id="seat-kick" type="button"></button>
        <button id="seat-close" type="button"></button>
      </section>

      <!-- What players have written about the game, for whoever makes it: the lobby opened with ?inbox, and a key. -->
      <section id="inbox-sheet" role="dialog" aria-modal="true" aria-labelledby="inbox-title" hidden>
        <h2 id="inbox-title"></h2>
        <form id="inbox-form" class="row">
          <input id="inbox-key" type="password" autocomplete="off" />
          <button id="inbox-open" type="submit" class="primary"></button>
          <button id="inbox-close" type="button"></button>
        </form>
        <p id="inbox-note" role="status"></p>
        <ol id="inbox-list"></ol>
      </section>

      <!-- The host's choice of another game for the room. -->
      <section id="swap-sheet" role="dialog" aria-modal="true" aria-labelledby="swap-title" hidden>
        <h2 id="swap-title"></h2>
        <div id="swap-choices" role="group" aria-labelledby="swap-title"></div>
        <p id="swap-hint" class="dim"></p>
        <p id="swap-note" class="dim"></p>
        <!-- 탈락전, the room's own way of playing game after game: the host turns it on and off here. -->
        <div class="row" id="swap-knockout-row">
          <button id="swap-knockout" type="button" aria-pressed="false"></button>
          <p id="swap-knockout-help" class="dim"></p>
        </div>
        <div class="row">
          <button id="swap-close" type="button"></button>
        </div>
      </section>

      <!-- The player's own record: the games this browser has played to the end. Kept in the browser and read from there. -->
      <section id="record-sheet" role="dialog" aria-modal="true" aria-labelledby="record-title" hidden>
        <h2 id="record-title"></h2>
        <p id="record-hint" class="dim"></p>
        <ul id="record-list"></ul>
        <div class="row">
          <button id="record-clear" type="button"></button>
          <button id="record-close" type="button" class="primary"></button>
        </div>
      </section>

      <!-- A word about the game, for whoever makes it: sent through the list of rooms, which the lobby is connected to. -->
      <section id="feedback-sheet" role="dialog" aria-modal="true" aria-labelledby="feedback-title" hidden>
        <h2 id="feedback-title"></h2>
        <p id="feedback-hint" class="dim"></p>
        <textarea id="feedback-text" autocomplete="off"></textarea>
        <p id="feedback-note" role="status"></p>
        <div class="row">
          <button id="feedback-close" type="button"></button>
          <button id="feedback-send" type="button" class="primary"></button>
        </div>
      </section>

      <!-- The rules of a game: main.ts writes the sheet of the game asked for (each game's words.ts). -->
      <section id="rules" hidden>
        <div id="rules-sheet"></div>
        <button id="rules-close" type="button" class="primary"></button>
      </section>
    </div>
    <!-- On a phone held upright the frame would be a strip too small to read. Where the browser can turn the page itself, a button does. -->
    <div id="turn-device" role="status">
      <p id="turn-words"></p>
      <button id="turn-full" type="button" hidden></button>
    </div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
