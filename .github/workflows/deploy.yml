name: CI

# Every push and pull request is typechecked and tested here, and a push to
# main that passes is deployed from here to the `play` Worker.
#
# The tests run once, on this machine. Until 2026-11-26 Cloudflare Workers
# Builds deployed instead, after running the same suite a second time on a
# machine that took 58 to 148 seconds over it (here: 23 to 34), and a push
# was past three minutes on the address when that machine was slow
# (.claude/rules/deploy-time.md). Workers Builds is disconnected from the
# repository: were it connected, every push would be deployed twice.
#
# Two secrets of the repository: CLOUDFLARE_API_TOKEN (a token of the
# "Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID. Only the
# step that deploys is given them, and a pull request never reaches it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Each action is named by the commit it is, not by a tag that can be moved
      # to another (SEC-010). To take a newer one: the commit of its release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # What was built above is what is deployed (`wrangler deploy` reads the configuration the build wrote).
      # Not when main has moved on meanwhile: the newer push deploys, with this one in it, and an older build
      # arriving after it would put the older page back.
      - name: Deploy to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]; then
            echo "main has moved on from $GITHUB_SHA: not deployed here, the newer push deploys it"
            exit 0
          fi
          npx wrangler deploy
