name: CI

# Every push and pull request is typechecked and tested here.
#
# Deployment does not happen in this workflow. Cloudflare Workers Builds is
# connected to this repository: a push to main is built there (typecheck,
# tests, build) and deployed to the `play` Worker, so no Cloudflare
# credential is stored in GitHub. Its settings live in the Cloudflare
# dashboard under Workers & Pages > play > Settings > Builds.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
