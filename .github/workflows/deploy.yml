name: CI

# Every push and pull request is typechecked and tested here.
#
# Deployment does not happen in this workflow. Cloudflare Workers Builds is
# connected to this repository: a push to main is built there (typecheck,
# tests, build) and deployed to the `play` Worker, so no Cloudflare
# credential is stored in GitHub. Its settings live in the Cloudflare
# dashboard under Workers & Pages > play > Settings > Builds.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Each action is named by the commit it is, not by a tag that can be moved
      # to another (SEC-010). To take a newer one: the commit of its release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
