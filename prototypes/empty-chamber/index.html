const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap'; // a headless shot or check asks for it; this 2D game draws the same either way
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events: anything the game wants a run to see

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');

  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';

}

// ---- Input: keys by position (event.code), OS key repeat ignored; clicks wait for the step ----

}

addEventListener('pointerdown', e => { startAudio(); const p = toLogical(e); ui.mx = p.x; ui.my = p.y; ui.clicks.push(p); });
const inRect = (p, x, y, w, h) => p.x >= x && p.x < x + w && p.y >= y && p.y < y + h;
const clickIn = (x, y, w, h) => ui.clicks.some(p => inRect(p, x, y, w, h));

// ---- Audio: started on first input, mute on M --------------------------------------------

    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)(); // a check may inject one
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };

  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted)); // the tweak panel (an add-on), when added, moved a value: the volume follows
function tone(freq, dur, type = 'square', vol = 0.3, at = 0, to = 0) { // to: slide the pitch there

    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);

let hiss = 12345; // the noise's own sequence, apart from the game's rng

    for (let i = 0; i < n; i++) { hiss = (hiss * 16807) % 2147483647; d[i] = (hiss / 1073741823.5 - 1) * Math.pow(1 - i / n, 2); }

}

  live: () => { tone(880, 0.09, 'square', 0.18, 0.25); tone(196, 0.3, 'sawtooth', 0.16, 0.33); },

  swap: () => { tone(300, 0.25, 'sawtooth', 0.14, 0, 900); tone(900, 0.25, 'sawtooth', 0.1, 0.05, 300); },
  out: () => tone(110, 0.35, 'sine', 0.4),
  beat: () => { tone(62, 0.12, 'sine', 0.5); tone(58, 0.14, 'sine', 0.4, 0.18); },
  alarm: () => tone(220, 0.6, 'sawtooth', 0.18, 0, 110),
  click: () => { tone(2100, 0.02, 'square', 0.22); tone(420, 0.05, 'triangle', 0.18, 0.02); },
  bang: () => { noise(0.5, 0.9, 0, 2400); tone(140, 0.35, 'sine', 0.6, 0, 40); },
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, 'triangle', 0.2, i * 0.11)),
  lose: () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.22, 'sawtooth', 0.14, i * 0.16)),
};

// =========================================================================================
// RULES. Pure functions over plain data: no canvas, no page, no clock. The table's flow and
// the bots read a game only through viewFor(), which leaves out what that seat may not know.
// Rules 1-9 are the source document's; the gaps it leaves are filled as the brief lists them.
// =========================================================================================
const N = 6; // seats, and chambers: one chamber faces each seat. The table is drawn for six.
const LETTERS = 'ABCDEF';
const mod = j => ((j % N) + N) % N;
const RC = () => ({ start: tune.start_credits, pub: tune.cost_public, priv: tune.cost_private, rot1: tune.cost_rot1,
  rot2: tune.cost_rot2, need: tune.tamper_need, tmax: tune.tamper_max, bullets: Math.min(tune.bullets, N - 1), endOut: tune.end_out_count });

// A new game. pids[seat] says who sits where (the seat draw). chambers[j] is the chamber j places
// clockwise from the muzzle: it faces seat muzzle + j. Turning the muzzle turns the whole cylinder.
function newGame(cfg, rnd, pids) {
  const ch = Array(N).fill(0);
  for (let b = 0; b < cfg.bullets;) { const j = Math.floor(rnd() * N); if (!ch[j]) { ch[j] = 1; b++; } }
  return {
    seats: pids.map(pid => ({ pid, credits: cfg.start, pot: 0, out: false, known: 0, subs: 0 })), // known: credits seen spent; subs: tamper deposits made
    ch, muzzle: 0, round: 0, turn: 0, cur: 0, phase: 'turn', swapSeat: -1, outCount: 0,
    pub: Array(N).fill(null),                    // what everyone has seen of each chamber
    priv: pids.map(() => Array(N).fill(null)),   // priv[seat][j]: what that seat alone has seen
    hist: [],                                    // what everyone saw happen, in order
  };
}
// Seat 1 leads round 1 and the lead moves one seat clockwise each round; a seat with no credits passes.
function advance(G) {
  for (let i = 0; i < N * 2; i++) {
    G.turn++; if (G.turn >= N) { G.turn = 0; G.round++; }
    G.cur = (G.round + G.turn) % N;
    if (!G.seats[G.cur].out) return;
  }
}
// One action by seat s. Returns what happened; ev.secret and ev.n are for seat s alone.
//   {type:'public'|'private', a}  look into chambers a and a+1      {type:'rot', k: 1|2}  turn the muzzle
//   {type:'tamper', n: 1..tmax}   a hidden deposit towards the swap  {type:'swap', a}      swap chambers a and a+1
function applyAction(G, s, act, cfg) {
  const p = G.seats[s], ev = { seat: s, type: act.type, ok: false };
  if (G.phase === 'swap') {
    if (act.type !== 'swap' || G.swapSeat !== s) return ev;
    const a = mod(act.a), b = mod(a + 1);
    [G.ch[a], G.ch[b]] = [G.ch[b], G.ch[a]];
    [G.pub[a], G.pub[b]] = [G.pub[b], G.pub[a]];     // what was known of a round goes with the round
    for (const k of G.priv) [k[a], k[b]] = [k[b], k[a]];
    G.phase = 'turn'; G.swapSeat = -1; ev.a = a;
    G.hist.push({ seat: s, type: 'swap', a });
  } else {
    if (G.phase !== 'turn' || G.cur !== s || p.out) return ev;
    if (act.type === 'public' || act.type === 'private') {
      const open = act.type === 'public', cost = open ? cfg.pub : cfg.priv;
      if (p.credits < cost) return ev;
      const a = mod(act.a), b = mod(a + 1);
      p.credits -= cost; p.known += cost;
      if (open) { G.pub[a] = G.ch[a]; G.pub[b] = G.ch[b]; ev.seen = [G.ch[a], G.ch[b]]; }
      else { G.priv[s][a] = G.ch[a]; G.priv[s][b] = G.ch[b]; ev.secret = [G.ch[a], G.ch[b]]; }
      ev.a = a; G.hist.push({ seat: s, type: act.type, a });
    } else if (act.type === 'rot') {
      const k = act.k === 2 ? 2 : 1, cost = k === 2 ? cfg.rot2 : cfg.rot1;
      if (p.credits < cost) return ev;
      p.credits -= cost; p.known += cost; G.muzzle = mod(G.muzzle + k); ev.k = k;
      G.hist.push({ seat: s, type: 'rot', k });
    } else if (act.type === 'tamper') {
      const n = Math.floor(act.n);
      if (!(n >= 1 && n <= cfg.tmax && n <= p.credits)) return ev;
      p.credits -= n; p.subs++; p.pot += n; ev.n = n;
      G.hist.push({ seat: s, type: 'tamper' });        // the table sees a deposit, never how much
      if (p.pot >= cfg.need) { p.pot = 0; G.phase = 'swap'; G.swapSeat = s; ev.earned = true; } // what is over the mark is lost
    } else return ev;
  }

  if (p.credits <= 0 && !p.out) { p.out = true; G.outCount++; ev.out = true; }
  if (G.phase === 'turn') {
    if (G.outCount >= cfg.endOut) { G.phase = 'ended'; ev.ended = true; }
    else advance(G);
  }
  return ev;
}
// The game as seat s may know it: its own credits and deposit, what the table has seen, what it has
// seen alone, and what follows from counting the rounds. Never another seat's credits or looks.
function viewFor(G, s, cfg) {
  const ch = G.pub.map((v, j) => v !== null ? v : G.priv[s][j]);
  const src = G.pub.map((v, j) => v !== null ? 'pub' : G.priv[s][j] !== null ? 'priv' : null);
  let b = 0, e = 0;
  for (const v of ch) { if (v === 1) b++; else if (v === 0) e++; }
  if (b >= cfg.bullets) ch.forEach((v, j) => { if (v === null) { ch[j] = 0; src[j] = 'inf'; } });
  else if (e >= N - cfg.bullets) ch.forEach((v, j) => { if (v === null) { ch[j] = 1; src[j] = 'inf'; } });
  return {
    me: s, credits: G.seats[s].credits, pot: G.seats[s].pot, muzzle: G.muzzle, round: G.round, cur: G.cur,
    phase: G.phase, swapSeat: G.swapSeat, outCount: G.outCount, chambers: ch, src,
    seats: G.seats.map(p => ({ pid: p.pid, out: p.out, // credits left, as far as anyone can count: a deposit hides 1 to tmax
      maxRem: p.out ? 0 : Math.max(1, cfg.start - p.known - p.subs),
      minRem: p.out ? 0 : Math.max(1, cfg.start - p.known - p.subs * cfg.tmax) })),
    hist: G.hist,
  };
}
// The end: from the seat the muzzle points at, clockwise, one chamber for each seat.
function volley(G) {
  const shots = [];
  for (let k = 0; k < N; k++) shots.push({ seat: mod(G.muzzle + k), chamber: k, hit: G.ch[k] === 1 });
  return shots;
}

// =========================================================================================
// BOTS. Each decides from viewFor() of its own seat and nothing else.
// =========================================================================================
// What the others' moves suggest about chambers nobody has shown: above 1 leans live, below 1 empty.
// Only the expert bots read this. A seat that looked into its own chamber alone and then turned the
// muzzle probably saw a round; one that stayed put probably did not.
function suspicion(view) {
  const w = Array(N).fill(1), seen = Array.from({ length: N }, () => new Set());
  let mz = 0;
  for (const h of view.hist) {
    const c = mod(h.seat - mz), mine = h.seat === view.me, knows = seen[h.seat].has(c);
    if (h.type === 'private') {
      if (knows && !mine) w[c] *= 0.5;
      seen[h.seat].add(h.a); seen[h.seat].add(mod(h.a + 1));
    } else if (h.type === 'public') {
      if (knows && !mine) w[c] *= 0.5;
    } else if (h.type === 'rot') {
      if (!mine) {
        if (knows) { w[c] *= 3; if (seen[h.seat].has(mod(c - h.k))) w[mod(c - h.k)] *= 0.4; }
        else w[c] *= 1.3;
      }
      mz = mod(mz + h.k);
    } else if (h.type === 'swap') {
      const a = h.a, b = mod(a + 1);
      [w[a], w[b]] = [w[b], w[a]];
      for (const set of seen) { const ha = set.has(a), hb = set.has(b); if (ha !== hb) { set.delete(ha ? a : b); set.add(ha ? b : a); } }
      if (!mine && (a === c || b === c)) { w[a === c ? b : a] *= 3; w[c] *= 0.4; }
    }
  }
  return w.map(x => Math.max(0.15, Math.min(6, x)));
}
function riskTable(view, w) { // the chance each chamber is live, from this seat's knowledge
  const v = view.chambers, cfg = RC();
  let b = 0, sum = 0;
  v.forEach((x, j) => { if (x === 1) b++; else if (x === null) sum += w[j]; });
  return v.map((x, j) => x !== null ? x : Math.max(0.02, Math.min(0.98, (cfg.bullets - b) * w[j] / sum)));
}
const pairOf = (x, y) => mod(x + 1) === mod(y) ? mod(x) : mod(y); // the pair holding two neighbouring chambers
function quietPair(view) { // a look that tells the table the least: chambers everyone has already seen
  let best = [], top = -1;
  for (let a = 0; a < N; a++) {
    const s = (view.src[a] === 'pub' ? 1 : 0) + (view.src[mod(a + 1)] === 'pub' ? 1 : 0);
    if (s > top) { top = s; best = [a]; } else if (s === top) best.push(a);
  }
  return best[Math.floor(rng() * best.length)];
}
function freshPair(view) { // a pair with something this seat has not seen
  const open = [];
  for (let a = 0; a < N; a++) if (view.chambers[a] === null || view.chambers[mod(a + 1)] === null) open.push(a);
  return open.length ? open[Math.floor(rng() * open.length)] : Math.floor(rng() * N);
}
function botSlip(view) { // a move made without thinking
  const cfg = RC(), cr = view.credits, bag = [];
  const add = (act, weight) => { for (let i = 0; i < weight; i++) bag.push(act); };
  if (cr >= cfg.pub) add({ type: 'public', a: Math.floor(rng() * N) }, 6);
  if (cr >= cfg.priv) add({ type: 'private', a: Math.floor(rng() * N) }, 4);
  if (cr >= cfg.rot1) add({ type: 'rot', k: 1 }, 2);
  if (cr >= cfg.rot2) add({ type: 'rot', k: 2 }, 1);

  return bag[Math.floor(rng() * bag.length)];
}
function botAct(view, level) {
  const cfg = RC(), hard = level === 1, cr = view.credits, pot = view.pot;
  if (rng() < (hard ? tune.bot_mistake_hard : tune.bot_mistake_normal)) return botSlip(view);
  const c = mod(view.me - view.muzzle);                       // the chamber facing me
  const risk = riskTable(view, hard ? suspicion(view) : Array(N).fill(1));
  const R = d => risk[mod(c + d)];                            // R(0) mine; R(-1) comes to me on a 1 turn, R(-2) on a 2 turn
  const known = d => view.chambers[mod(c + d)] !== null;
  const nearEnd = view.outCount >= cfg.endOut - 1;            // the next seat to run dry ends the game
  let low = 0;
  view.seats.forEach((s, i) => { if (i !== view.me && !s.out && s.maxRem <= cfg.rot2) low++; });
  const soonEnd = view.outCount + low >= cfg.endOut - 1;      // it could end within a turn or two
  const look = (a, alone) => alone && cr >= cfg.priv ? { type: 'private', a: mod(a) } : cr >= cfg.pub ? { type: 'public', a: mod(a) } : { type: 'tamper', n: 1 };
  const stall = () => hard || rng() < 0.5 ? { type: 'tamper', n: 1 } : look(freshPair(view), false);

  // A move that spends my last credit ends the game on the spot: take one that leaves me safe.
  if (nearEnd) {
    const enders = [];
    if (cr === cfg.rot1) enders.push({ act: { type: 'rot', k: 1 }, r: R(-1) });
    if (cr === cfg.rot2) enders.push({ act: { type: 'rot', k: 2 }, r: R(-2) });
    if (cr <= cfg.tmax) enders.push({ act: { type: 'tamper', n: cr }, r: pot + cr >= cfg.need ? Math.min(R(0), R(1), R(-1)) : R(0) });
    if (cr === cfg.pub) enders.push({ act: { type: 'public', a: quietPair(view) }, r: R(0) });
    if (cr === cfg.priv) enders.push({ act: { type: 'private', a: mod(c - 1) }, r: R(0) });
    enders.sort((x, y) => x.r - y.r);
    if (enders.length && enders[0].r <= 0.12 && (hard || rng() < 0.6)) return enders[0].act;
  }
  const r0 = R(0);
  // I think a round is facing me.
  if (r0 >= 0.7) {
    const outs = [];
    if (cr >= cfg.rot1) outs.push({ act: { type: 'rot', k: 1 }, r: R(-1), cost: cfg.rot1 });
    if (cr >= cfg.rot2) outs.push({ act: { type: 'rot', k: 2 }, r: R(-2), cost: cfg.rot2 });
    const short = cfg.need - pot;                             // credits still missing for the swap
    if (short <= Math.min(cfg.tmax, cr)) outs.push({ act: { type: 'tamper', n: short }, r: Math.min(R(1), R(-1)), cost: short });
    outs.sort((x, y) => (x.r - y.r) || (x.cost - y.cost));
    if (!hard || soonEnd || rng() < tune.bot_flee_hard) {     // a normal bot gets rid of it at once; an expert picks its moment, and must once time is short
      if (outs.length && outs[0].r < r0 - 0.2) return outs[0].act;
      if (pot + cr >= cfg.need) return { type: 'tamper', n: Math.min(cfg.tmax, cr, short) };
      if (outs.length && outs[0].r < r0) return outs[0].act;
      return stall();

    if ((!known(-1) || !known(-2)) && cr >= tune.bot_reserve_hard + cfg.priv) return look(c - 2, true); // learn where a turn would take me
    return { type: 'tamper', n: Math.max(1, Math.min(cfg.tmax, short, cr - tune.bot_reserve_hard)) };    // and build the swap, keeping enough back to turn the muzzle
  }
  // I don't know what is facing me.
  if (r0 > 0.12) {
    if (soonEnd && r0 >= 0.3) {                               // no time to look: turn to a chamber I know is empty
      if (cr >= cfg.rot1 && R(-1) <= 0.12) return { type: 'rot', k: 1 };
      if (cr >= cfg.rot2 && R(-2) <= 0.12) return { type: 'rot', k: 2 };

  }

    const [ax, ay] = hatchXY(an.a, ringA), [bx, by] = hatchXY(mod(an.a + 1), ringA), u = ease(an.t / an.dur), lift = Math.sin(u * Math.PI) * 7;
    for (const [x0, y0, x1, y1, up] of [[ax, ay, bx, by, 1], [bx, by, ax, ay, -1]]) {

    }

    px(p.x - I(w / 2) - 3, y - 1, w + 6, 15, C.ink); txt(p.text, p.x, y, p.color, 'center');
  }
}
function drawScene() {

  drawRoom(); drawLamp(lamp.sway);
  for (const p of [2, 3, 4]) drawSeat(mod(S.me + p));
  drawTable();

  let hide = null, info = hatchInfo;

  }

}
function drawPanel() {

function promptLine() { // [words, colour] for the line above the buttons
  const S = state, G = S.g, V = S.view, cfg = RC(), sel = S.sel, close = G.outCount >= cfg.endOut - 1;
  if (S.noteT > 0) return [S.note, C.amber];
  if (S.phase === 'deal') return ['자리 추첨 중', C.boneD];
  if (S.phase === 'fire') return ['격발: 총구가 향한 자리부터 시계 방향으로 한 발씩', C.crim];
  if (S.phase === 'bot') return [V.seats[S.me].out ? `크레딧 소진: 지켜볼 수밖에 없습니다 · ${nm(G.cur)} 차례` : `${nm(G.cur)} 차례`, C.boneD];
  if (S.phase === 'anim') return [S.log.length ? S.log[S.log.length - 1].text : '', C.boneD];
  if (!sel) {
    const v = V.chambers[myChamber()];
    if (close) return ['내 차례: 누구든 크레딧을 다 쓰면 그 자리에서 격발입니다', C.amber];
    if (ui.games === 0 && S.myTurns <= 2) { // the first turns of the first game teach by the next thing to do
      if (v === null) return ['내 차례: 1이나 2로 내 앞 약실부터 조사해 보세요', C.amber];
      if (v === 1) return ['내 앞이 실탄! 3이나 4로 총구를 돌려 옆자리로 넘기세요', C.crim];
      return ['내 앞은 비었습니다. 크레딧을 아끼며 다른 자리를 살피세요', C.teal];
    }
    return ['내 차례: 행동을 고르세요 (1~5)', C.amber];
  }
  const pair = `${LETTERS[sel.pair]}·${LETTERS[mod(sel.pair + 1)]}`;
  if (sel.mode === 'pick') return [`${sel.act === 0 ? '공개 조사' : '비공개 조사'}: ${pair} 칸 · 좌우 키로 고르기`, C.amber];
  if (sel.mode === 'swap') return [`조작권! 맞바꿀 두 칸 ${pair} · 좌우 키로 고르기`, C.amber];
  if (sel.mode === 'amount') return [`조작에 ${sel.n}개 제출 · 좌우 키로 개수 · 모은 ${V.pot}/${cfg.need}`, C.amber];
  const k = sel.act === 2 ? 1 : 2, j = mod(myChamber() - k), v = V.chambers[j];
  return [`${k}칸 회전: ${LETTERS[j]} 약실(${v === 1 ? '실탄' : v === 0 ? '빔' : '모름'})이 내 앞으로`, v === 1 ? C.crim : C.amber];
}
function smallButton(r, label, strong) {

  px(r[0], r[1], r[2], r[3], strong ? C.amberD : C.steelDD); px(r[0] + 1, r[1] + 1, r[2] - 2, r[3] - 2, hov ? C.btnH : C.btn);

function drawBar() {
  const S = state, V = S.view, cfg = RC(), live = S.phase === 'human', sel = S.sel;

const HELP = [
  ['빈 약실: 규칙', C.amber],
  ['약실 여섯 칸 중 두 칸에 실탄이 있습니다. 한 자리에 약실 한 칸이', C.bone],
  ['마주 보고, 마지막 격발 때 내 앞 약실이 비어 있으면 생존입니다.', C.bone],
  ['', C.bone],
  ['내 차례에는 다섯 가지 중 하나를 합니다. 크레딧은 16개로 시작합니다.', C.bone],
  ['1 공개 조사 (1): 이웃한 두 칸이 찼는지 모두에게 공개', C.boneD],
  ['2 비공개 조사 (2): 이웃한 두 칸을 나만 확인', C.boneD],
  ['3 1칸 회전 (3) · 4 2칸 회전 (4): 총구와 실린더가 시계 방향으로 돈다.', C.boneD],

  ['5 조작: 한 번에 1~3개씩 몰래 모아 6이 되면 이웃한 두 칸의 탄을 맞바꿈', C.boneD],
  ['', C.bone],
  ['남은 크레딧은 본인만 압니다. 크레딧이 남아 있으면 쉴 수 없습니다.', C.bone],

function drawHelp() {

}

  px(PANEL_X, 60, 168, 1, C.steelDD);

  txt(ui.level === 1 ? '고수' : '보통', lx, 161, C.amber, 'center');
  txt('좌우 키로 바꾸기', PANEL_X, 175, C.dim);
  if (Math.floor(t * 2) % 2 === 0) txt('Enter: 시작', mx, 194, C.amber, 'center');
  if (ui.wins + ui.losses > 0) txt(`전적 ${ui.wins}승 ${ui.losses}패`, mx, 208, C.boneD, 'center');
  px(0, BAR_Y, W, H - BAR_Y, C.bar); px(0, BAR_Y, W, 1, C.steelDD);
  txt('여섯 약실에 실탄 두 발. 마지막 격발 때 내 앞 약실이 비어 있으면 생존.', 6, 228, C.bone);
  txt('나머지 다섯 자리에는 봇이 앉습니다. 온라인 대전은 아직 없습니다.', 6, 242, C.boneD);
  txt('H: 규칙 보기', 6, 256, C.amber);

function drawFigures() { // every figure side by side, named: for the outline check
  clear(C.floor);
  txt('앞모습', 8, 6, C.boneD); txt('뒷모습 (가까운 세 자리)', 8, 104, C.boneD); txt('약실', 8, 200, C.boneD);
  CAST.forEach((c, i) => {
    const x = 60 + i * 72;
    drawFigure(i, x, 56, false, 1); txt(c.name + (i ? '·봇' : ''), x, 78, C.bone, 'center');
    drawFigure(i, x, 150, true, 1); txt(c.name + (i ? '·봇' : ''), x, 174, C.bone, 'center');
  });
  const kinds = [[null, null, '모름'], [0, 'pub', '빔 (모두 앎)'], [1, 'pub', '실탄 (모두 앎)'], [0, 'priv', '빔 (나만 앎)'], [1, 'priv', '실탄 (나만 앎)']];
  kinds.forEach(([v, src, label], i) => { const x = 60 + i * 92; drawHatch(x, 232, v, src, LETTERS[i]); txt(label, x, 246, C.boneD, 'center'); });
}

// ---- Scenes: title, play, results (a game with an end), and figures for the outline check -------
const scenes = {
  figures: { update(dt) { state.t += dt; }, draw() { drawFigures(); } },
  title: {
    update(dt) {
      state.t += dt;
      if (pressed('KeyH')) ui.help = !ui.help;
      if (ui.help) { if (pressed('Escape') || pressed('Enter')) ui.help = false; return; }
      if (pressed('ArrowLeft') || pressed('ArrowRight') || pressed('KeyA') || pressed('KeyD') || clickIn(PANEL_X + 70, 158, 98, 16)) { ui.level = 1 - ui.level; sfx.move(); }
      if (pressed('Enter') || pressed('NumpadEnter') || pressed('Space') || clickIn(PANEL_X, 190, 168, 16)) { reset(); scene = 'play'; sfx.pick(); }
    },
    draw() { drawTitle(); },
  },
  play: {
    update(dt) {
      const S = state;
      if (pressed('KeyH')) ui.help = !ui.help;
      if (ui.help) { if (pressed('Escape') || pressed('Enter')) ui.help = false; return; } // the rules sheet stops the table
      if (pressed('KeyF')) ui.fast = !ui.fast;
      if (pressed('KeyR') && S.phase !== 'fire') { // a new game in the middle of one: asked for twice, so a slip of the finger costs nothing
        if (S.again > 0) { ui.games++; reset(); return; }
        S.again = 2.5; S.note = 'R을 한 번 더 누르면 이 판을 버리고 새 판을 시작합니다'; S.noteT = 2.5;
      }
      if (S.again > 0) S.again -= dt;
      tickTable(dt);
      const quick = ui.fast ? tune.fast_mult : 1; // only the waiting on bots goes faster
      if (S.phase === 'deal') {
        S.timer -= dt;
        const n = Math.min(N, Math.floor((1 - S.timer / S.dealDur) * (N + 1)));
        while (S.dealShown < n) { sfx.seat(S.dealShown); S.dealShown++; }
        if (S.timer <= 0) {
          S.dealShown = N;
          say(`자리 추첨: 나는 ${S.me + 1}번 자리`, C.amber); say(`1라운드 · 선 ${nm(0)}`, C.boneD);
          S.logMark = S.log.length; goTurn();
        }
      } else if (S.phase === 'bot') {
        S.timer -= dt * quick;
        if (S.timer <= 0) perform(S.g.cur, S.plan);
      } else if (S.phase === 'anim') {
        const step = dt * (S.anim.seat === S.me ? 1 : quick);
        S.timer -= step; S.anim.t = Math.min(S.anim.dur, S.anim.t + step);
        if (S.timer <= 0) afterAnim();
      } else if (S.phase === 'human') updateHuman();
      else if (S.phase === 'fire') updateFire(dt);
    },
    draw() { drawPlay(); },
  },
  results: {
    update(dt) {
      tickTable(dt);
      if (pressed('KeyH')) ui.help = !ui.help;
      if (ui.help) { if (pressed('Escape') || pressed('Enter')) ui.help = false; return; }
      if (pressed('KeyR') || pressed('Enter') || pressed('NumpadEnter') || clickIn(0, BAR_Y, W, H - BAR_Y)) { ui.games++; reset(); scene = 'play'; }
      else if (pressed('KeyT') || pressed('Escape')) { ui.games++; reset(); scene = 'title'; }
    },
    draw() { drawPlay(); },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear(); ui.clicks.length = 0;
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; // draw between steps, so the view never judders
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
if (!scenes[scene]) scene = 'title';
last = clock.now();
if (document.fonts && document.fonts.load) { // the pixel font comes from assets/: draw again once it is in
  Promise.all([document.fonts.load('12px Galmuri11'), document.fonts.load('24px Galmuri11')]).then(() => drawFrame(), () => {});
}
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
